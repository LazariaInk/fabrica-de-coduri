<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Fabrica de Coduri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="auth-shell">
    <section class="auth-panel">
        <div class="auth-copy">
            <p class="eyebrow">Cursuri video premium</p>
            <h1>Autentifica-te si continua invatarea</h1>
            <p>Contul tau iti permite sa cumperi cursuri si sa vizionezi lectiile video premium intr-un singur loc.</p>
        </div>

        <form class="auth-card" th:action="@{/login}" method="post">
            <h2>Login</h2>
            <label>
                Email
                <input type="text" name="username" placeholder="nume@email.com" required autofocus>
            </label>
            <label>
                Parola
                <input type="password" name="password" placeholder="Parola ta" required>
            </label>

            <p class="auth-error" th:if="${param.error}">Datele de autentificare nu sunt corecte sau contul nu este confirmat.</p>
            <p class="auth-success" th:if="${param.logout}">Ai iesit din cont.</p>

            <button type="submit">Intra in cont</button>
            <p class="auth-switch">Nu ai cont? <a th:href="@{/register}">Creeaza unul</a></p>
        </form>
    </section>
</main>
</body>
</html>
