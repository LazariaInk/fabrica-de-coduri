<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cursuri video premium - Fabrica de Coduri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="courses-page">
    <section class="courses-hero">
        <div>
            <p class="eyebrow">Biblioteca premium</p>
            <h1>Cursuri video ca pe Udemy, explicate in romana</h1>
            <p>Cauta cursul potrivit, vezi programa gratuit si autentifica-te cand vrei sa cumperi sau sa vizionezi.</p>
        </div>
        <form class="course-search" th:action="@{/courses}" method="get">
            <input type="search" name="q" th:value="${query}" placeholder="Cauta Java, Python, React...">
            <button type="submit">Cauta</button>
        </form>
    </section>

    <section class="course-grid">
        <article class="course-card" th:each="course : ${courses}" th:style="'--accent:' + ${course.accentColor}">
            <a class="course-card-link" th:href="@{'/courses/' + ${course.slug}}">
                <div class="course-thumb">
                    <span th:text="${#strings.substring(course.title, 0, 1)}">C</span>
                </div>
                <div class="course-card-body">
                    <div class="course-meta">
                        <span th:text="${course.level}">Nivel</span>
                        <span th:text="${course.duration}">Durata</span>
                    </div>
                    <h2 th:text="${course.title}">Titlu curs</h2>
                    <p th:text="${course.subtitle}">Descriere curs</p>
                    <div class="course-stats">
                        <span th:text="${course.lessons + ' lectii'}">64 lectii</span>
                        <strong th:text="${course.price + ' RON'}">199 RON</strong>
                    </div>
                    <span class="owned-badge" th:if="${purchasedCourses.contains(course.slug)}">In biblioteca</span>
                </div>
            </a>
        </article>
    </section>

    <p class="empty-state" th:if="${courses.isEmpty()}">Nu am gasit cursuri pentru cautarea ta.</p>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
