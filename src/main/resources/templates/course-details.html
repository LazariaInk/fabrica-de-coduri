<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${course.title + ' - Fabrica de Coduri'}">Curs premium</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="course-detail-page" th:style="'--accent:' + ${course.accentColor}">
    <section class="course-detail-hero">
        <div class="course-detail-copy">
            <a class="back-link" th:href="@{/courses}">Inapoi la cursuri</a>
            <p class="eyebrow" th:text="${course.level + ' / ' + course.duration}">Nivel / durata</p>
            <h1 th:text="${course.title}">Titlu curs</h1>
            <p th:text="${course.subtitle}">Descriere</p>
            <div class="course-detail-meta">
                <span th:text="${course.lessons + ' lectii video'}">Lectii</span>
                <span th:text="${'Instructor: ' + course.instructor}">Instructor</span>
            </div>
        </div>
        <aside class="purchase-box">
            <div class="price" th:text="${course.price + ' RON'}">199 RON</div>
            <a class="primary-action" th:if="${purchased}" th:href="@{'/courses/' + ${course.slug} + '/watch'}">Vizioneaza cursul</a>
            <a class="primary-action" th:if="${!purchased and !loggedIn}" th:href="@{/login}">Login pentru cumparare</a>
            <form th:if="${!purchased and loggedIn}" th:action="@{'/courses/' + ${course.slug} + '/buy'}" method="post">
                <button class="primary-action" type="submit">Cumpara cursul</button>
            </form>
            <p>Acces instant dupa cumparare. Nelogat poti vedea doar prezentarea si programa.</p>
        </aside>
    </section>

    <section class="course-detail-content">
        <div>
            <h2>Ce vei invata</h2>
            <ul class="check-list">
                <li th:each="outcome : ${course.outcomes}" th:text="${outcome}">Obiectiv</li>
            </ul>
        </div>
        <div>
            <h2>Programa cursului</h2>
            <ol class="module-list">
                <li th:each="module : ${course.modules}" th:text="${module}">Modul</li>
            </ol>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
