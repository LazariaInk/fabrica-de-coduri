<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resetare parola - Fabrica de Coduri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="auth-shell">
    <section class="auth-panel">
        <div class="auth-copy">
            <p class="eyebrow">Parola noua</p>
            <h1>Seteaza o parola noua</h1>
            <p>Alege o parola noua pentru contul tau Fabrica de Coduri.</p>
        </div>

        <form class="auth-card" th:action="@{/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="token" th:value="${token}">
            <h2>Resetare parola</h2>
            <p class="auth-error" th:if="${error}" th:text="${error}"></p>
            <label th:if="${error == null}">
                Parola noua
                <input type="password" name="newPassword" minlength="8" required>
            </label>
            <label th:if="${error == null}">
                Confirma parola noua
                <input type="password" name="confirmPassword" minlength="8" required>
            </label>
            <button th:if="${error == null}" type="submit">Reseteaza parola</button>
            <p class="auth-switch"><a th:href="@{/login}">Inapoi la login</a></p>
        </form>
    </section>
</main>
</body>
</html>
