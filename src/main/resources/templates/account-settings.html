<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account settings - Fabrica de Coduri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body class="auth-page">
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="account-settings-page">
    <section class="account-settings-layout">
        <div class="account-summary">
            <div class="account-avatar-large">
                <img th:if="${currentUserAvatarUrl != ''}" th:src="${currentUserAvatarUrl}" alt="Avatar">
                <span th:if="${currentUserAvatarUrl == ''}" th:text="${currentUserInitial}">U</span>
            </div>
            <p class="eyebrow">Contul tau</p>
            <h1>Account settings</h1>
            <p th:text="${user.username}">user@email.com</p>
        </div>

        <div class="settings-stack">
            <form class="auth-card settings-card" th:action="@{/account/settings/avatar}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <h2>Poza de profil</h2>
                <label class="avatar-dropzone" for="avatarUpload">
                    <input id="avatarUpload" type="file" name="avatar" accept="image/png,image/jpeg,image/webp,image/gif">
                    <span class="avatar-drop-icon">+</span>
                    <strong>Trage poza aici sau apasa pentru upload</strong>
                    <small>JPG, PNG, WEBP sau GIF, maximum 5MB</small>
                    <img id="avatarPreview" alt="Preview poza profil">
                </label>
                <p class="settings-help">Poza Gmail poate fi luata automat doar daca userul intra prin Google OAuth. Pentru cont email/parola, incarca poza aici.</p>
                <p class="auth-error" th:if="${avatarError}" th:text="${avatarError}"></p>
                <p class="auth-success" th:if="${avatarSuccess}" th:text="${avatarSuccess}"></p>
                <button type="submit">Salveaza poza</button>
            </form>

            <form class="auth-card settings-card" th:action="@{/account/settings/password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <h2>Schimba parola</h2>
                <label>
                    Parola curenta
                    <input type="password" name="currentPassword" required>
                </label>
                <label>
                    Parola noua
                    <input type="password" name="newPassword" minlength="8" required>
                </label>
                <label>
                    Confirma parola noua
                    <input type="password" name="confirmPassword" minlength="8" required>
                </label>

                <p class="auth-error" th:if="${error}" th:text="${error}"></p>
                <p class="auth-success" th:if="${success}" th:text="${success}"></p>
                <button type="submit">Salveaza parola</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
