<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${'Vizioneaza ' + course.title}">Vizioneaza curs</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="watch-page" th:style="'--accent:' + ${course.accentColor}">
    <section class="watch-layout">
        <aside class="lesson-playlist">
            <a class="back-link" th:href="@{'/courses/' + ${course.slug}}">Detalii curs</a>
            <h1 th:text="${course.title}">Curs</h1>
            <button class="playlist-item active" th:each="module, stat : ${course.modules}" type="button">
                <span th:text="${stat.count}">1</span>
                <strong th:text="${module}">Modul</strong>
            </button>
        </aside>

        <section class="video-area">
            <p class="auth-success" th:if="${successMessage}" th:text="${successMessage}"></p>
            <div class="video-placeholder">
                <div class="play-circle">▶</div>
                <p>Lectie demo premium</p>
            </div>
            <div class="watch-notes">
                <h2>Lectia curenta</h2>
                <p>Aici vei conecta playerul video real pentru fiecare lectie. Fluxul de acces este deja pregatit: doar utilizatorii logati si cu acest curs cumparat ajung pe pagina.</p>
            </div>
        </section>
    </section>
</main>
</body>
</html>
