<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Creare cont - Fabrica de Coduri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="auth-shell">
    <section class="auth-panel">
        <div class="auth-copy">
            <p class="eyebrow">Cont nou</p>
            <h1>Intra in biblioteca de cursuri premium</h1>
            <p>Creeaza un cont pentru a cumpara cursuri video, a le pastra in biblioteca si a reveni la ele cand vrei.</p>
        </div>

        <form class="auth-card" th:action="@{/register}" method="post" th:object="${user}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h2>Creare cont</h2>
            <label>
                Email
                <input type="email" th:field="*{username}" placeholder="nume@email.com" required>
            </label>
            <label>
                Parola
                <input type="password" th:field="*{password}" placeholder="Alege o parola" required>
            </label>
            <label>
                Confirma parola
                <input type="password" th:field="*{confirmPassword}" placeholder="Repeta parola" required>
            </label>

            <p class="auth-error" th:if="${error}" th:text="${error}"></p>
            <button type="submit">Creeaza cont</button>
            <p class="auth-switch">Ai deja cont? <a th:href="@{/login}">Autentifica-te</a></p>
        </form>
    </section>
</main>
</body>
</html>
