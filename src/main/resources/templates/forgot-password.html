<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Am uitat parola - Fabrica de Coduri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="auth-shell">
    <section class="auth-panel">
        <div class="auth-copy">
            <p class="eyebrow">Resetare parola</p>
            <h1>Recupereaza accesul la cont</h1>
            <p>Introdu emailul contului tau si iti trimitem un link de resetare valabil 60 de minute.</p>
        </div>

        <form class="auth-card" th:action="@{/forgot-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h2>Am uitat parola</h2>
            <label>
                Email
                <input type="email" name="email" placeholder="nume@email.com" required>
            </label>
            <p class="auth-success" th:if="${success}" th:text="${success}"></p>
            <button type="submit">Trimite linkul</button>
            <p class="auth-switch"><a th:href="@{/login}">Inapoi la login</a></p>
        </form>
    </section>
</main>
</body>
</html>
